# Orquestación de todos los contenedores. `docker compose up -d --build` levanta
# el sistema completo; cada `service` es un contenedor con su propia imagen.
# Las dependencias con `condition` garantizan que las migraciones terminen
# antes de que los microservicios empiecen a consultar las tablas.
services:
  # 1. BASE DE DATOS (PostgreSQL + pgvector)
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-gestion_personas}
    ports:
      - "5432:5432"
    volumes:
      # Volumen con nombre: los datos sobreviven a `docker compose down`.
      - postgres_data:/var/lib/postgresql/data
      # init.sql crea la BD `n8n_db` para los metadatos del workflow.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-gestion_personas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MIGRACIONES ALEMBIC (se ejecuta una vez antes de los microservicios)
  db-migrate:
    build:
      context: ./backend
      dockerfile: ms-person-create/Dockerfile
    container_name: db-migrate
    # Contenedor de un solo uso: aplica la migración inicial y termina.
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://admin:admin123@postgres-db:5432/gestion_personas}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network

  # 3. AUTENTICACIÓN SSO ROBLE (o modo mock)
  ms-auth:
    build:
      context: ./backend
      dockerfile: ms-auth/Dockerfile
    container_name: ms-auth
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres-db:5432/${POSTGRES_DB:-gestion_personas}
    depends_on:
      postgres-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  # 4. MICROSERVICIOS CRUD DE PERSONAS
  ms-person-create:
    build:
      context: ./backend
      dockerfile: ms-person-create/Dockerfile
    container_name: ms-person-create
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://admin:admin123@postgres-db:5432/gestion_personas}
      LOGS_SERVICE_URL: http://ms-logs:8000
      AUTH_SERVICE_URL: http://ms-auth:8000
      UPLOAD_DIR: /app/uploads
    volumes:
      # El mismo volumen se monta en los servicios que escriben y en el gateway.
      - uploads_data:/app/uploads
    depends_on:
      postgres-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      ms-logs:
        condition: service_started
    networks:
      - app-network

  ms-person-update:
    build:
      context: ./backend
      dockerfile: ms-person-update/Dockerfile
    container_name: ms-person-update
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://admin:admin123@postgres-db:5432/gestion_personas}
      LOGS_SERVICE_URL: http://ms-logs:8000
      AUTH_SERVICE_URL: http://ms-auth:8000
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      ms-logs:
        condition: service_started
    networks:
      - app-network

  ms-person-delete:
    build:
      context: ./backend
      dockerfile: ms-person-delete/Dockerfile
    container_name: ms-person-delete
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://admin:admin123@postgres-db:5432/gestion_personas}
      LOGS_SERVICE_URL: http://ms-logs:8000
      AUTH_SERVICE_URL: http://ms-auth:8000
    depends_on:
      postgres-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      ms-logs:
        condition: service_started
    networks:
      - app-network

  # 5. MICROSERVICIO DE CONSULTA AISLADO (habilitable/deshabilitable)
  ms-person-query:
    build:
      context: ./backend
      dockerfile: ms-person-query/Dockerfile
    container_name: ms-person-query
    # Sin restart automático: se enciende/apaga manualmente (prueba de R7).
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://admin:admin123@postgres-db:5432/gestion_personas}
      LOGS_SERVICE_URL: http://ms-logs:8000
      AUTH_SERVICE_URL: http://ms-auth:8000
    depends_on:
      postgres-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      ms-logs:
        condition: service_started
    networks:
      - app-network

  # 6. MICROSERVICIO DE AUDITORÍA Y LOGS
  ms-logs:
    build:
      context: ./backend
      dockerfile: ms-logs/Dockerfile
    container_name: ms-logs
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://admin:admin123@postgres-db:5432/gestion_personas}
      AUTH_SERVICE_URL: http://ms-auth:8000
    depends_on:
      postgres-db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  # 7. AUTOMATIZACIÓN & RAG (n8n Self-Hosted)
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    # No se expone el puerto 5678: todo el acceso pasa por el gateway (/n8n/),
    # donde se aplica basic auth. Así no se puede eludir la protección.
    env_file: .env
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_PATH: /n8n/
      WEBHOOK_URL: http://localhost/n8n/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}
      # Metadatos de n8n en su propia BD; los datos de personas se consultan
      # desde el workflow con una credencial separada a gestion_personas.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-admin}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows:ro
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - app-network

  # 8. FRONTEND (React + Vite) — perfil `ui`, no requerido para el backend
  frontend:
    # Con `profiles`, no arranca en el `up` normal; se activa con
    # `docker compose --profile ui up frontend` (ver @no_ui en nginx.conf).
    profiles: ["ui"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api/v1
    networks:
      - app-network

  # 9. API GATEWAY (Nginx Reverse Proxy)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: nginx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    env_file: .env   # N8N_USER / N8N_PASSWORD → htpasswd del entrypoint
    volumes:
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      - ms-auth
      - ms-person-create
      - ms-person-update
      - ms-person-delete
      - ms-logs
      - n8n
    networks:
      - app-network

volumes:
  postgres_data:
  n8n_data:
  uploads_data:

networks:
  app-network:
    driver: bridge
