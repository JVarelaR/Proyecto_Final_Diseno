# API Gateway: único punto de entrada (puerto 80). En POO sería la fachada del
# sistema: la SPA y n8n hablan SOLO con esta dirección, nunca con un microservicio.
# Cada bloque `location` redirige a un contenedor distinto según la URL.
events {
    worker_connections 1024;
}

http {
    # Resolución dinámica del DNS interno de Docker: permite apagar
    # ms-person-query o frontend sin que Nginx deje de arrancar (R7).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # `upstream` define el nombre lógico del servicio. Docker resuelve
    # `ms-auth:8000` por su DNS interno; si el contenedor se reinicia con otra
    # IP, Nginx la vuelve a resolver gracias al `resolver` de arriba.
    upstream ms_auth       { server ms-auth:8000; }
    upstream ms_create     { server ms-person-create:8000; }
    upstream ms_update     { server ms-person-update:8000; }
    upstream ms_delete     { server ms-person-delete:8000; }
    upstream ms_logs       { server ms-logs:8000; }
    upstream n8n_service   { server n8n:5678; }

    server {
        listen 80;
        server_name _;
        # SECURITY: limitar el cuerpo evita que un cliente suba un archivo
        # gigante y llene el disco. 3 MB = foto ≤ 2 MB + overhead del formulario.
        client_max_body_size 3m;   # foto ≤ 2 MB + overhead del formulario
        # Valor por defecto heredado por todos los locations. El include no lo
        # repite para poder subirlo a 300s solo en /n8n/ (chat RAG con LLM).
        proxy_read_timeout 60s;

        # ---------- Autenticación (necesaria para que la SPA obtenga el Bearer) ----------
        # Sin barra final: coincide exactamente con los prefijos de los APIRouter.
        # Si se pusiera "/api/v1/create/", Nginx haría 301 y FastAPI devolvería
        # 307 de vuelta, generando un bucle de redirecciones.
        # SECURITY: `/api/v1/auth` es público SOLO para login/signup; el token
        # se valida en ms-auth y se reenvía como Bearer al resto de rutas.
        location /api/v1/auth {
            proxy_pass http://ms_auth;
            include /etc/nginx/includes/proxy.conf;
        }

        # ---------- CRUD ----------
        location /api/v1/create {
            proxy_pass http://ms_create;
            include /etc/nginx/includes/proxy.conf;
        }

        location /api/v1/update {
            proxy_pass http://ms_update;
            include /etc/nginx/includes/proxy.conf;
        }

        location /api/v1/delete {
            proxy_pass http://ms_delete;
            include /etc/nginx/includes/proxy.conf;
        }

        location /api/v1/logs {
            proxy_pass http://ms_logs;
            include /etc/nginx/includes/proxy.conf;
        }

        # ---------- Consulta aislada (R7): si el contenedor está parado, 503 controlado ----------
        location /api/v1/query {
            set $query_upstream http://ms-person-query:8000;
            proxy_pass $query_upstream;
            include /etc/nginx/includes/proxy.conf;
            proxy_next_upstream error timeout http_502 http_503;
            error_page 502 503 504 = @query_offline;
        }

        location @query_offline {
            default_type application/json;
            return 503 '{"detail":"El servicio de consulta está deshabilitado temporalmente"}';
        }

        # ---------- Fotos subidas ----------
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
        }

        # ---------- Chat RAG de n8n (basic auth generado en el entrypoint) ----------
        location /n8n/ {
            # SECURITY: n8n no expone su puerto 5678; solo se entra por aquí y
            # el htpasswd se genera en el entrypoint desde variables de entorno.
            # auth_basic "n8n - Gestion de Datos Personales";
            # dauth_basic_user_file /etc/nginx/.htpasswd;
            # Barra final: /n8n/rest/... → /rest/... y /n8n/webhook/... → /webhook/...
            # Sin ella, la API REST de n8n cae en el fallback HTML del editor.
            proxy_pass http://n8n_service/;
            include /etc/nginx/includes/proxy.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # El LLM puede tardar: 300s aquí frente a los 60s del resto (arriba).
            proxy_read_timeout 300s;
        }

        # ---------- Frontend (perfil `ui`): si no está levantado, no rompe el gateway ----------
        location / {
            set $frontend_upstream http://frontend:5173;
            proxy_pass $frontend_upstream;
            include /etc/nginx/includes/proxy.conf;
            error_page 502 503 504 = @no_ui;
        }

        location @no_ui {
            default_type application/json;
            return 200 '{"mensaje":"Backend listo. La interfaz se activa con: docker compose --profile ui up frontend"}';
        }
    }
}
