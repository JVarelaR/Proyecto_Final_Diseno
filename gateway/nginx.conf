events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Permite subir fotos de hasta 2MB + margen de encabezados HTTP
    client_max_body_size 5M;

    # Resolución dinámica de contenedores en Docker
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # Cabeceras CORS globales para desarrollo
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 1. Autenticación (ms-auth) -> Mantiene prefijo /auth/
        location /auth/ {
            set $auth_upstream http://ms-auth:8000;
            proxy_pass $auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Microservicios CRUD
        location /api/v1/create {
            set $create_upstream http://ms-person-create:8000;
            proxy_pass $create_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/update {
            set $update_upstream http://ms-person-update:8000;
            proxy_pass $update_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/delete {
            set $delete_upstream http://ms-person-delete:8000;
            proxy_pass $delete_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Consulta aislada (devuelve 503 JSON si el contenedor se detiene bajo demanda)
        location /api/v1/query {
            set $query_upstream http://ms-person-query:8000;
            proxy_pass $query_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_intercept_errors on;
            error_page 502 503 504 = @query_unavailable;
        }

        location @query_unavailable {
            default_type application/json;
            return 503 '{"detail": "El servicio de consulta se encuentra deshabilitado temporalmente."}';
        }

        location /api/v1/logs {
            set $logs_upstream http://ms-logs:8000;
            proxy_pass $logs_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. n8n (soporta WebSockets para el chat)
        location /n8n/ {
            set $n8n_upstream http://n8n:5678;
            proxy_pass $n8n_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. Frontend SPA
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}