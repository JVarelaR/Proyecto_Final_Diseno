
# API Gateway: único punto de entrada (puerto 80).
# Actúa como fachada del sistema: centraliza el acceso a los microservicios,
# el frontend y n8n mediante el proxy inverso de Nginx.

events {
    worker_connections 1024;
}

http {
    # DNS interno de Docker.
    # Permite resolver servicios por sus nombres dentro de app-network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Servicios internos.
    upstream ms_auth {
        server ms-auth:8000;
    }

    upstream ms_create {
        server ms-person-create:8000;
    }

    upstream ms_update {
        server ms-person-update:8000;
    }

    upstream ms_delete {
        server ms-person-delete:8000;
    }

    upstream ms_logs {
        server ms-logs:8000;
    }

    upstream n8n_service {
        server n8n:5678;
    }

    server {
        listen 80;
        server_name _;

        # Límite para las solicitudes y fotografías.
        client_max_body_size 3m;

        # Timeout predeterminado para los microservicios.
        proxy_read_timeout 60s;

        # --------------------------------------------------
        # 1. AUTENTICACIÓN
        # --------------------------------------------------
        location /api/v1/auth {
            proxy_pass http://ms_auth;
            include /etc/nginx/includes/proxy.conf;
        }

        # --------------------------------------------------
        # 2. CREACIÓN DE PERSONAS
        # --------------------------------------------------
        location /api/v1/create {
            proxy_pass http://ms_create;
            include /etc/nginx/includes/proxy.conf;
        }

        # --------------------------------------------------
        # 3. ACTUALIZACIÓN DE PERSONAS
        # --------------------------------------------------
        location /api/v1/update {
            proxy_pass http://ms_update;
            include /etc/nginx/includes/proxy.conf;
        }

        # --------------------------------------------------
        # 4. ELIMINACIÓN DE PERSONAS
        # --------------------------------------------------
        location /api/v1/delete {
            proxy_pass http://ms_delete;
            include /etc/nginx/includes/proxy.conf;
        }

        # --------------------------------------------------
        # 5. AUDITORÍA Y LOGS
        # --------------------------------------------------
        location /api/v1/logs {
            proxy_pass http://ms_logs;
            include /etc/nginx/includes/proxy.conf;
        }

        # --------------------------------------------------
        # 6. CONSULTA DE PERSONAS
        # --------------------------------------------------
        # La consulta está aislada de los demás servicios.
        # Si se encuentra deshabilitada, devuelve HTTP 503.
        location /api/v1/query {
            set $query_upstream http://ms-person-query:8000;

            proxy_pass $query_upstream;
            include /etc/nginx/includes/proxy.conf;

            proxy_next_upstream error timeout http_502 http_503;
            error_page 502 503 504 = @query_offline;
        }

        location @query_offline {
            default_type application/json;

            return 503 '{"detail":"El servicio de consulta está deshabilitado temporalmente"}';
        }

        # --------------------------------------------------
        # 7. MICROSERVICIO RAG AUTENTICADO
        # --------------------------------------------------
        # FastAPI valida el token Bearer mediante ms-auth.
        # El procesamiento con IA se integrará posteriormente.
        location /api/v1/rag/ {
            proxy_pass http://ms-rag:8000;
            include /etc/nginx/includes/proxy.conf;

            # Tiempo adicional para consultas con modelos locales.
            proxy_read_timeout 180s;
        }

        # --------------------------------------------------
        # 8. FOTOGRAFÍAS ALMACENADAS
        # --------------------------------------------------
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
        }

        # --------------------------------------------------
        # 9. N8N Y WORKFLOW RAG
        # --------------------------------------------------
        # n8n utiliza su propia autenticación de usuario.
        #
        # La autenticación HTTP Basic de Nginx permanece
        # desactivada porque interfería con las solicitudes
        # internas del editor de n8n.
        #
        # ADVERTENCIA:
        # El webhook del chat sigue accesible directamente.
        # Antes de utilizar datos reales, se deberá restringir
        # su acceso y exigir autorización en el backend.

        location /n8n/ {
            # auth_basic "n8n - Gestion de Datos Personales";
            # auth_basic_user_file /etc/nginx/.htpasswd;

            # La barra final elimina el prefijo /n8n/ al
            # reenviar la solicitud hacia el contenedor.
            proxy_pass http://n8n_service/;

            include /etc/nginx/includes/proxy.conf;

            # Compatibilidad con conexiones WebSocket.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Tiempo adicional para la generación con Ollama.
            proxy_read_timeout 300s;
        }

        # --------------------------------------------------
        # 10. FRONTEND REACT + VITE
        # --------------------------------------------------
        # El frontend utiliza el perfil ui de Docker Compose.
        # Si está detenido, el gateway sigue funcionando.

        location / {
            set $frontend_upstream http://frontend:5173;

            proxy_pass $frontend_upstream;
            include /etc/nginx/includes/proxy.conf;

            error_page 502 503 504 = @no_ui;
        }

        location @no_ui {
            default_type application/json;

            return 200 '{"mensaje":"Backend listo. La interfaz se activa con: docker compose --profile ui up frontend"}';
        }
    }
}
