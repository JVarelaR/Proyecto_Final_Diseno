# Included by every `location` in nginx.conf. `proxy_set_header` reenvía la
# identidad real del cliente al microservicio; sin Host, FastAPI no sabría bajo
# qué dominio se sirve y el proxy_pass podría construir URLs equivocadas.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
# El timeout de LECTURA se define en nginx.conf (60s normal, 300s en /n8n/)
# porque el chat RAG espera a OpenRouter y tarda más que un CRUD.
